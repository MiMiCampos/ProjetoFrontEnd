<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Algoritmos - UFAC</title>
    <link rel="stylesheet" href="/css/prof.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- <link rel="stylesheet" href="/css/global.css"> -->
</head>
<body>
    <div class="app-container">
        
        <div class="header-blue">
            <a href="/html/prof_turmas.html" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <div class="logo-wrapper">
                <img src="/componentes/logo_ufac.png" alt="UFAC">
            </div>

            <div class="header-title-area">
                <h1 class="page-title">Algoritmos</h1>
                <p class="page-subtitle">CCET005</p>
            </div>

            <div class="stats-header-grid">
                <div class="stat-box"><strong>10</strong><span>Alunos</span></div>
                <div class="stat-box"><strong>91%</strong><span>Frequência</span></div>
                <div class="stat-box"><strong>7.8</strong><span>Média</span></div>
            </div>
        </div>

        <div class="content-list">
            
            <a href="/html/prof_chamada.html" class="card-item">
                <div class="card-icon" style="background-color: #4ade80; width: 45px; height: 45px;"><i class="fa-solid fa-user-group"></i></div>
                <div class="card-info" style="flex-grow: 1;">
                    <h3 style="font-size: 1.1rem; margin: 0;">Chamada</h3>
                    <p style="margin: 3px 0 0 0;">Registrar frequência</p>
                </div>
                <i class="fa-solid fa-chevron-right card-arrow"></i>
            </a>

            <a href="/html/prof_notas.html" class="card-item">
                <div class="card-icon" style="background-color: #3b82f6; width: 45px; height: 45px;"><i class="fa-solid fa-chart-column"></i></div>
                <div class="card-info" style="flex-grow: 1;">
                    <h3 style="font-size: 1.1rem; margin: 0;">Notas</h3>
                    <p style="margin: 3px 0 0 0;">Lançar e editar notas</p>
                </div>
                <i class="fa-solid fa-chevron-right card-arrow"></i>
            </a>

            <a href="/html/prof_atividades.html" class="card-item">
                <div class="card-icon" style="background-color: #fbbf24; width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.2rem; margin-right: 15px;">
                    <i class="fa-solid fa-clipboard-list"></i>
                </div>
                <div class="card-info" style="flex-grow: 1;">
                    <h3 style="font-size: 1.05rem; color: #1e293b; margin: 0;">Atividades</h3>
                    <p style="font-size: 0.85rem; color: #64748b; margin: 3px 0 0 0;">2 pendentes de correção</p>
                </div>
                <div style="background-color: #ef4444; color: white; font-size: 0.75rem; font-weight: bold; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 10px;">
                    2
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #cbd5e1; font-size: 0.9rem;"></i>
            </a>

            <a href="/html/prof_material.html" class="card-item">
                <div class="card-icon" style="background-color: #a855f7; width: 45px; height: 45px;"><i class="fa-solid fa-book-open"></i></div>
                <div class="card-info" style="flex-grow: 1;">
                    <h3 style="font-size: 1.1rem; margin: 0;">Material Didático</h3>
                    <p style="margin: 3px 0 0 0;">PDFs, vídeos e arquivos</p>
                </div>
                <i class="fa-solid fa-chevron-right card-arrow"></i>
            </a>

            <a href="/html/prof_avisos.html" class="card-item">
                <div class="card-icon" style="background-color: #d946ef; width: 45px; height: 45px;"><i class="fa-regular fa-comment-dots"></i></div>
                <div class="card-info" style="flex-grow: 1;">
                    <h3 style="font-size: 1.1rem; margin: 0;">Avisos</h3>
                    <p style="margin: 3px 0 0 0;">Comunicação para turma</p>
                </div>
                <i class="fa-solid fa-chevron-right card-arrow"></i>
            </a>

            <a href="/html/prof_lista_alunos.html" class="card-item">
                <div class="card-icon" style="background-color: #64748b; width: 45px; height: 45px;"><i class="fa-solid fa-users"></i></div>
                <div class="card-info" style="flex-grow: 1;">
                    <h3 style="font-size: 1.1rem; margin: 0;">Lista de Alunos</h3>
                    <p style="margin: 3px 0 0 0;">10 matriculados</p>
                </div>
                <i class="fa-solid fa-chevron-right card-arrow"></i>
            </a>
