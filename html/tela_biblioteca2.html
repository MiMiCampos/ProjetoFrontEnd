<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - Portal da Ufac</title>
    <link rel="stylesheet" href="tela_biblioteca.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <button class="btn-back" onclick="location.href='tela_biblioteca1.html'">
        <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="top-info">
        <div class="date-badge">Terça-feira, 26 de maio de 2026</div>
        <div class="weather-badge">
            <i class="fa-solid fa-sun"></i> 31°C
        </div>
    </div>

    <div class="main-container">
        <header class="portal-header">
            <img src="ufac_logotipo.png" alt="Logo Ufac" class="logo-ufac" onerror="this.style.display='none'">
            <h1>Portal da Ufac</h1>
        </header>

        <div class="tabs-container-lib">
            <div class="tab-lib-blue clickable" onclick="location.href='tela_biblioteca1.html'">
                <span>Minha<br>Biblioteca</span>
            </div>
        </div>

        <main class="content-card">
            <div class="search-bar-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" placeholder="Estou buscando por livros, periódicos...">
            </div>

            <div class="sub-section-header header-green">
                <i class="fa-solid fa-calendar-days"></i>
                <span>Reservas</span>
            </div>

            <div class="status-panel-box bg-green">
                <div class="book-status-card">
                    <div class="card-book-details">
                        <strong>BOLDRINI, Jose Luiz et al., Algebra linear.</strong>
                        <p>Reservado para: 13/05/2026</p>
                        <p>Código: 78929</p>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow-detail"></i>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
