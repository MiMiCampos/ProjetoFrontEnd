<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Documentos - Portal da Ufac</title>
    <link rel="stylesheet" href="tela_documentos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <button class="btn-back" onclick="location.href='tela_inicial.html'">
        <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="top-info">
        <div class="date-badge">Terça-feira, 26 de maio de 2026</div>
        <div class="weather-badge">
            <i class="fa-solid fa-sun"></i> 31°C
        </div>
    </div>

    <div class="main-container">
        
        <header class="portal-header">
            <img src="ufac_logotipo.png" alt="Logo Ufac" class="logo-ufac" onerror="this.style.display='none'">
            <h1>Portal da Ufac</h1>
        </header>

        <div class="section-badge-container">
            <div class="section-badge">
                <span>Meus<br>Documentos</span>
            </div>
        </div>

        <main class="content-card">
            <div class="documents-grid">
                
                <div class="doc-card">
                    <div class="doc-info">
                        <span class="doc-title">Atestado de Matrícula</span>
                        <i class="fa-solid fa-graduation-cap doc-icon"></i>
                    </div>
                    <button class="btn-download" onclick="location.href='tela_erro.html'">
                        <span>baixar documento</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <div class="doc-card">
                    <div class="doc-info">
                        <span class="doc-title">Comprovante de Matrícula</span>
                        <i class="fa-solid fa-list-check doc-icon"></i>
                    </div>
                    <button class="btn-download" onclick="location.href='tela_erro.html'">
                        <span>baixar documento</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <div class="doc-card">
                    <div class="doc-info">
                        <span class="doc-title">Ficha Cadastral do Aluno</span>
                        <i class="fa-solid fa-id-card doc-icon"></i>
                    </div>
                    <button class="btn-download" onclick="location.href='tela_erro.html'">
                        <span>baixar documento</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <div class="doc-card">
                    <div class="doc-info">
                        <div class="title-group">
                            <span class="doc-title">Histórico Escolar</span>
                            <span class="doc-subtitle">Simplificado</span>
                        </div>
                        <i class="fa-solid fa-file-invoice doc-icon"></i>
                    </div>
                    <button class="btn-download" onclick="location.href='tela_erro.html'">
                        <span>baixar documento</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <div class="doc-card">
                    <div class="doc-info">
                        <span class="doc-title">Histórico de Integralização</span>
                        <i class="fa-solid fa-box-archive doc-icon"></i>
                    </div>
                    <button class="btn-download" onclick="location.href='tela_erro.html'">
                        <span>baixar documento</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <div class="doc-card">
                    <div class="doc-info">
                        <span class="doc-title">Solicitação de Matrícula</span>
                        <i class="fa-solid fa-file-signature doc-icon"></i>
                    </div>
                    <button class="btn-download" onclick="location.href='tela_erro.html'">
                        <span>baixar documento</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

            </div>
        </main>
    </div>

</body>
</html>
