<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Horários - Portal da Ufac</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/tela_horarios.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../javascript/components-loader.js" defer></script>
</head>
<body class="tela-centralizada">

    <header id="header-container" role="banner"></header>

    <div class="main-container">
        
        <div class="top-bar-container">
            <div class="tabs-container">
                <div class="tab-blue">
                    <span>Meus<br>Horários</span>
                </div>
            </div>

            <div class="mascot-capivara">
                <img src="../assets/capi3.png" alt="Mascote Capivara fofa">
            </div>
        </div>

        <main class="content-card">
            <div class="subject-list">
                
                <div class="subject-item" onclick="location.href='tela_horarios2.html'">
                    <div class="subject-icon">
                        <i class="fa-solid fa-database"></i>
                    </div>
                    <div class="subject-details">
                        <h3>Banco de Dados I</h3>
                        <p class="code">CCET023</p>
                        <p class="status">Situação: <span>Matrícula</span></p>
                    </div>
                </div>

                <div class="subject-item" onclick="location.href='tela_erro.html'">
                    <div class="subject-icon">
                        <i class="fa-solid fa-network-wired"></i>
                    </div>
                    <div class="subject-details">
                        <h3>Comunicação e Redes</h3>
                        <p class="code">CCET025</p>
                        <p class="status">Situação: <span>Matrícula</span></p>
                    </div>
                </div>

                <div class="subject-item" onclick="location.href='tela_erro.html'">
                    <div class="subject-icon">
                        <i class="fa-solid fa-calculator"></i>
                    </div>
                    <div class="subject-details">
                        <h3>Contabilidade</h3>
                        <p class="code">CCSA129</p>
                        <p class="status">Situação: <span>Matrícula</span></p>
                    </div>
                </div>

            </div>
        </main>
    </div>

</body>
</html>
