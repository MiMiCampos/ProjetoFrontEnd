<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Professor</title>
    <link rel="stylesheet" href="/css/prof.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container bg-white">
        
        <div class="header-blue">
            <div class="logo-wrapper">
                <img src="/componentes/logo_ufac.png" alt="UFAC" style="width: 45px; height: 45px; border-radius: 8px;">
            </div>
            <button class="btn-back" onclick="window.location.href='login.html'">
                <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
            </button>

            <div class="dashboard-user-info">
                <div class="user-text">
                    <p>Professor(a)</p>
                    <h2>Maria Clara!</h2>
                </div>
                <div style="font-size: 3rem;">🦦</div> 
            </div>
        </div>

        <div class="white-board">
            <input type="text" class="search-bar" placeholder="🔍 O que você deseja buscar hoje?">
            
            <div class="grid-menu">
                <a href="/html/prof_turmas.html" class="menu-item">
                    <i class="fa-solid fa-chalkboard-user"></i>
                    Minhas Turmas
                </a>
                
                <a href="/html/prof_chamada.html" class="menu-item">
                    <i class="fa-solid fa-pen-to-square"></i> 
                    Chamada
                </a>
                
                <a href="#" class="menu-item"><i class="fa-solid fa-file-lines"></i> Atividades</a>
                <a href="#" class="menu-item"><i class="fa-regular fa-clock"></i> Horários</a>
                <a href="#" class="menu-item"><i class="fa-solid fa-utensils"></i> Restaurante Universitário</a>
                <a href="#" class="menu-item"><i class="fa-solid fa-building-columns"></i> Biblioteca</a>
                <a href="#" class="menu-item"><i class="fa-solid fa-folder-open"></i> Editais</a>
                <a href="#" class="menu-item"><i class="fa-solid fa-file-contract"></i> Documentos</a>
                <a href="#" class="menu-item"><i class="fa-solid fa-newspaper"></i> Notícias</a>
                <a href="#" class="menu-item"><i class="fa-regular fa-comments"></i> Fórum</a>
            </div>
        </div>

    </div>
</body>
</html>
